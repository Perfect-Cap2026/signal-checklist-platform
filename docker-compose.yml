version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: signalsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signalsdb
      TV_SECRET: replace_me
      NEWSAPI_KEY: ""
    depends_on:
      - db
    ports:
      - '8000:8000'

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  pgdata:
